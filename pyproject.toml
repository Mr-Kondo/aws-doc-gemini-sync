[project]
name = "aws-doc-gemini-sync"
version = "0.1.0"
description = "Synchronize AWS official documentation into Google Docs for use as Gemini Notebook knowledge sources"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "feedparser>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "google-api-python-client>=2.130",
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
# Optional: enables the AWS Documentation MCP Server fetch backend.
# The pipeline works without it via the Markdown and HTML backends.
mcp = [
    "mcp>=1.2",
]

[project.scripts]
aws-doc-sync = "aws_doc_sync.cli:main"

# Installed by a plain `uv sync`, so the documented development commands work
# immediately after checkout.
[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_doc_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: talks to real external APIs; requires credentials (deselected by default)",
]
addopts = "-m 'not integration'"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["aws_doc_sync"]
mypy_path = "src"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
